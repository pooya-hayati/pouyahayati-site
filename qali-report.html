<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>گزارش پیشرفت کار — کالی</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFFFFF;
    --cream-2:#F3F1EE;
    --ink:#2A211D;
    --ink-soft:#5B4F49;
    --red:#AC1F1F;
    --red-hover:#780000;
    --rust:#8B6B54;
    --mushroom:#B7927A;
    --line:#E5E0D8;
    --card-bg:#FFFFFF;
    --done-green:#5C7A54;
    --upcoming-amber:#A9762C;
    --shadow: 0 1px 2px rgba(42,33,29,.06);
    --font: 'Vazirmatn', Tahoma, Arial, sans-serif;
  }
  :root:not([data-theme="light"]){
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#1C1613;
      --cream-2:#241C18;
      --ink:#F2E9DD;
      --ink-soft:#C9B9AC;
      --card-bg:#251E1A;
      --line:#3B2F28;
      --red:#C0392B;
      --red-hover:#E05545;
      --rust:#D9604F;
      --mushroom:#B7927A;
      --done-green:#7FA073;
      --upcoming-amber:#D4A24C;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --cream:#1C1613;
    --cream-2:#241C18;
    --ink:#F2E9DD;
    --ink-soft:#C9B9AC;
    --card-bg:#251E1A;
    --line:#3B2F28;
    --red:#C0392B;
    --red-hover:#E05545;
    --rust:#D9604F;
    --mushroom:#B7927A;
    --done-green:#7FA073;
    --upcoming-amber:#D4A24C;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:var(--font);
    line-height:1.6;
    min-height:100vh;
    padding-bottom:48px;
  }

  /* ---- header ---- */
  header{
    padding:28px 20px 0;
    max-width:920px;
    margin:0 auto;
  }
  .brand-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brand-logo{
    height:34px;
    width:auto;
    display:block;
  }
  .brand span.tag{
    font-size:14px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .updated{
    font-size:13px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .sub{
    margin:6px 0 0;
    color:var(--ink-soft);
    font-size:14.5px;
    max-width:60ch;
  }

  /* ---- kilim guard band ---- */
  .motif{
    height:12px;
    margin:22px auto 0;
    max-width:920px;
    background-image:
      linear-gradient(135deg, var(--cream) 25%, transparent 25%),
      linear-gradient(225deg, var(--cream) 25%, transparent 25%),
      linear-gradient(315deg, var(--cream) 25%, transparent 25%),
      linear-gradient(45deg, var(--cream) 25%, var(--red) 25%);
    background-position: 0 0, 6px 0, 6px -6px, 0px 6px;
    background-size: 12px 12px;
    opacity:.85;
  }

  main{
    max-width:920px;
    margin:0 auto;
    padding:22px 20px 0;
  }

  /* ---- tabs ---- */
  .tabs{
    display:flex;
    gap:8px;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  .tab-btn{
    appearance:none;
    border:none;
    background:none;
    font-family:var(--font);
    font-size:15.5px;
    font-weight:600;
    color:var(--ink-soft);
    padding:10px 4px 12px;
    cursor:pointer;
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .tab-btn .count{
    font-size:12px;
    font-weight:700;
    background:var(--cream-2);
    color:var(--ink-soft);
    border-radius:20px;
    padding:1px 8px;
  }
  .tab-btn[aria-selected="true"]{
    color:var(--ink);
  }
  .tab-btn[aria-selected="true"] .count{
    background:var(--red);
    color:#fff;
  }
  .tab-btn[aria-selected="true"]::after{
    content:"";
    position:absolute;
    right:0;left:0;bottom:-1px;
    height:2px;
    background:var(--red);
    border-radius:2px;
  }
  .tab-btn + .tab-btn{ margin-inline-start:8px; }

  /* ---- domain filter chips ---- */
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:20px;
  }
  .chip{
    appearance:none;
    cursor:pointer;
    font-family:var(--font);
    font-size:13.5px;
    font-weight:600;
    padding:6px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--ink-soft);
    transition:.15s ease;
  }
  .chip[aria-pressed="true"]{
    background:var(--ink);
    color:var(--cream);
    border-color:var(--ink);
  }

  /* ---- domain groups ---- */
  .group{ margin-bottom:26px; }
  .group-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    margin:0 0 10px;
  }
  .group-title .dot{
    width:8px;height:8px;border-radius:50%;
    flex:none;
  }
  .group-title .num{
    color:var(--ink-soft);
    font-weight:500;
  }

  .card-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .card{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-inline-start:4px solid var(--mushroom);
    border-radius:10px;
    padding:13px 16px;
    box-shadow:var(--shadow);
    display:flex;
    align-items:flex-start;
    gap:12px;
  }
  .card.dev{ border-inline-start-color:var(--red); }
  .card.seo{ border-inline-start-color:var(--rust); }
  .card.noon{ border-inline-start-color:var(--upcoming-amber); }

  .card .status-icon{
    flex:none;
    width:20px;height:20px;
    margin-top:2px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .card.is-done .status-icon{ background:color-mix(in srgb, var(--done-green) 18%, transparent); }
  .card.is-upcoming .status-icon{ background:color-mix(in srgb, var(--upcoming-amber) 20%, transparent); }
  .card .status-icon svg{ width:12px; height:12px; }
  .card.is-done .status-icon svg{ stroke:var(--done-green); }
  .card.is-upcoming .status-icon svg{ stroke:var(--upcoming-amber); }

  .card-body{ flex:1; min-width:0; }
  .card-title{
    font-size:15px;
    font-weight:600;
    margin:0 0 2px;
    color:var(--ink);
  }
  .card-note{
    font-size:13px;
    color:var(--ink-soft);
    margin:0;
  }
  .card-meta{
    flex:none;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--cream-2);
    padding:3px 9px;
    border-radius:7px;
    white-space:nowrap;
  }

  .empty{
    text-align:center;
    color:var(--ink-soft);
    padding:40px 10px;
    font-size:14.5px;
  }

  /* ---- insights tab ---- */
  .insights-section{ margin-bottom:32px; }
  .insights-heading{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 4px;
  }
  .insights-sub{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 14px;
  }

  .funnel-row{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
  }
  .funnel-stage{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 12px;
    text-align:center;
    box-shadow:var(--shadow);
  }
  .funnel-stage .fs-label{
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:600;
    margin:0 0 6px;
  }
  .funnel-stage .fs-value{
    font-size:22px;
    font-weight:800;
    color:var(--ink);
    margin:0;
  }
  .funnel-stage .fs-pct{
    font-size:11px;
    color:var(--upcoming-amber);
    font-weight:700;
    margin-top:4px;
  }
  .funnel-stage.zero .fs-value{ color:var(--red); }
  .funnel-stage.zero .fs-pct{ color:var(--red); }

  .table-wrap{
    overflow-x:auto;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--card-bg);
  }
  table.campaign-table{
    width:100%;
    border-collapse:collapse;
    font-size:12.5px;
    min-width:560px;
  }
  table.campaign-table th, table.campaign-table td{
    padding:9px 10px;
    text-align:right;
    white-space:nowrap;
  }
  table.campaign-table thead th{
    font-weight:700;
    color:var(--ink-soft);
    background:var(--cream-2);
    font-size:11.5px;
  }
  table.campaign-table tbody tr + tr{ border-top:1px solid var(--line); }
  table.campaign-table td.num{ font-variant-numeric: tabular-nums; }
  table.campaign-table tr.best td.name{ color:var(--done-green); font-weight:700; }
  table.campaign-table tr.worst td.name{ color:var(--red); font-weight:700; }

  .notes-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .note-item{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-inline-start:4px solid var(--upcoming-amber);
    border-radius:10px;
    padding:12px 14px;
    font-size:13.5px;
    line-height:1.7;
  }
  .note-item b{ color:var(--ink); }

  @media (max-width:560px){
    .funnel-row{ grid-template-columns:repeat(2, 1fr); }
  }

  .split-list{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-top:16px;
  }
  .split-row .split-label{
    display:flex;
    justify-content:space-between;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .split-bar{
    height:22px;
    border-radius:6px;
    overflow:hidden;
    display:flex;
    background:var(--cream-2);
    border:1px solid var(--line);
  }
  .split-bar .seg-ads{
    background:var(--red);
  }
  .split-bar .seg-organic{
    background:var(--mushroom);
  }
  .split-values{
    display:flex;
    justify-content:space-between;
    margin-top:5px;
    font-size:11px;
    font-weight:600;
  }
  .split-values .v-ads{ color:var(--red); }
  .split-values .v-organic{ color:var(--mushroom); }
  .split-legend{
    display:flex;
    gap:16px;
    margin-top:10px;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .split-legend span{ display:flex; align-items:center; gap:5px; }
  .split-legend i{ width:9px; height:9px; border-radius:2px; display:inline-block; }

  footer{
    max-width:920px;
    margin:34px auto 0;
    padding:16px 20px 0;
    border-top:1px solid var(--line);
    color:var(--ink-soft);
    font-size:12.5px;
  }

  @media (max-width:520px){
    .brand-logo{ height:28px; }
    .card{ padding:11px 12px; }
  }
</style>
</head>

</header>

<div class="motif"></div>

<main>
  <div class="tabs" role="tablist">
    <button class="tab-btn" role="tab" id="tab-upcoming" aria-selected="true" data-view="upcoming">
      برنامه‌ریزی‌شده <span class="count" id="count-upcoming">0</span>
    </button>
    <button class="tab-btn" role="tab" id="tab-done" aria-selected="false" data-view="done">
      انجام‌شده <span class="count" id="count-done">0</span>
    </button>
    <button class="tab-btn" role="tab" id="tab-insights" aria-selected="false" data-view="insights">
      اینسایت نون
    </button>
  </div>

  <div class="chips" id="domain-chips"></div>

  <div id="list-root"></div>
</main>

<script>
const DOMAINS = {
  dev:   { label: 'دولوپ سایت',      color: 'var(--red)' },
  seo:   { label: 'سئو',              color: 'var(--rust)' },
  noon:  { label: 'پلتفرم نون',       color: 'var(--upcoming-amber)' },
};

// status: 'upcoming' | 'done'
const TASKS = [
  // ---------------- UPCOMING ----------------
  { domain:'noon', status:'upcoming', title:'افزودن عکس‌های طراحی‌شده به بقیه محصولات', note:'برای ۲ محصول پربازدید انجام شد (پایین را ببینید)؛ ادامه برای بقیه محصولات' },

function renderChips(){
  const root = document.getElementById('domain-chips');
  const domainKeys = Object.keys(DOMAINS);
  const chips = [{key:'all', label:'همه'}, ...domainKeys.map(k => ({key:k, label:DOMAINS[k].label}))];
  root.innerHTML = '';
  chips.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = c.label;
    btn.setAttribute('aria-pressed', String(c.key === currentDomain));
    btn.addEventListener('click', () => { currentDomain = c.key; render(); });
    root.appendChild(btn);
  });
}

function iconSvg(status){
  if(status === 'done'){
    return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  }
  return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline></svg>';
}

function renderInsights(){
  const root = document.getElementById('list-root');
  const f = INSIGHTS.funnel;
  const funnelHtml = f.map(s => `
    <div class="funnel-stage ${s.zero ? 'zero' : ''}">
      <p class="fs-label">${s.label}</p>
      <p class="fs-value">${s.value}</p>
      ${s.pct ? `<p class="fs-pct">${s.pct}</p>` : ''}
    </div>
  `).join('');

  const rows = INSIGHTS.campaigns.map(c => `
    <tr class="${c.best ? 'best' : ''} ${c.worst ? 'worst' : ''}">
      <td class="name">${c.name}</td>
      <td class="num">${c.views}</td>
      <td class="num">${c.clicks}</td>
      <td class="num">${c.ctr}</td>
      <td class="num">${c.spend}</td>
      <td class="num">${c.atc}</td>
    </tr>
  `).join('');

  const notesHtml = INSIGHTS.notes.map(n => `<div class="note-item">${n}</div>`).join('');

  root.innerHTML = `
    <div class="insights-section">
      <p class="insights-heading">قیف فروش پلتفرم نون</p>
      <p class="insights-sub">بازه: ${INSIGHTS.period}</p>
      <div class="funnel-row">${funnelHtml}</div>
      <div class="split-list">
        ${INSIGHTS.split.map(s => {
          const adsPct = Math.round((s.ads / s.total) * 1000) / 10;
          const orgPct = Math.round((s.organic / s.total) * 1000) / 10;
          return `
          <div class="split-row">
            <div class="split-label"><span>${s.label}</span><span>از ${s.total.toLocaleString('fa-IR')}</span></div>
            <div class="split-bar">
              <div class="seg-ads" style="width:${adsPct}%"></div>
              <div class="seg-organic" style="width:${orgPct}%"></div>
            </div>
            <div class="split-values">
              <span class="v-ads">کمپین‌ها: ${s.ads.toLocaleString('fa-IR')} (${adsPct}٪)</span>
              <span class="v-organic">ارگانیک: ${s.organic.toLocaleString('fa-IR')} (${orgPct}٪)</span>
            </div>
          </div>`;
        }).join('')}
        <div class="split-legend">
          <span><i style="background:var(--red)"></i>کمپین‌های تبلیغاتی</span>
          <span><i style="background:var(--mushroom)"></i>ارگانیک</span>
        </div>
      </div>
    </div>

    <div class="insights-section">
      <p class="insights-heading">گزارش کمپین‌های تبلیغاتی</p>
      <p class="insights-sub">مجموع: ${INSIGHTS.campaignTotals.views} نمایش، ${INSIGHTS.campaignTotals.clicks} کلیک، ${INSIGHTS.campaignTotals.spend} AED هزینه، ${INSIGHTS.campaignTotals.atc} افزودن به سبد، ${INSIGHTS.campaignTotals.orders} خرید</p>
      <div class="table-wrap">
        <table class="campaign-table">
          <thead>
            <tr>
              <th>کمپین</th><th>نمایش</th><th>کلیک</th><th>CTR</th><th>هزینه (AED)</th><th>افزودن به سبد</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>

    <div class="insights-section">
      <p class="insights-heading">تحلیل و پیشنهاد بهبود</p>
      <div class="notes-list">${notesHtml}</div>
    </div>
  `;
}

function render(){
  document.getElementById('tab-upcoming').setAttribute('aria-selected', String(currentView === 'upcoming'));
  document.getElementById('tab-done').setAttribute('aria-selected', String(currentView === 'done'));
  document.getElementById('tab-insights').setAttribute('aria-selected', String(currentView === 'insights'));

  const upcomingCount = TASKS.filter(t => t.status === 'upcoming').length;
  const doneCount = TASKS.filter(t => t.status === 'done').length;
  document.getElementById('count-upcoming').textContent = upcomingCount;
  document.getElementById('count-done').textContent = doneCount;

  const chipsEl = document.getElementById('domain-chips');
  const root = document.getElementById('list-root');

  if(currentView === 'insights'){
    chipsEl.style.display = 'none';
    renderInsights();
    return;
  }
  chipsEl.style.display = '';

  renderChips();

  const filtered = TASKS.filter(t => t.status === currentView && (currentDomain === 'all' || t.domain === currentDomain));
  root.innerHTML = '';

  if(filtered.length === 0){
    root.innerHTML = '<div class="empty">در این بخش فعلاً کاری ثبت نشده.</div>';
    return;
  }

  const domainOrder = ['dev','seo','noon'];
  domainOrder.forEach(domKey => {
    const items = filtered.filter(t => t.domain === domKey);
    if(items.length === 0) return;
    const group = document.createElement('div');
    group.className = 'group';
    group.innerHTML = `
      <div class="group-title">
        <span class="dot" style="background:${DOMAINS[domKey].color}"></span>
        ${DOMAINS[domKey].label}
        <span class="num">(${items.length})</span>
      </div>
      <div class="card-list"></div>
    `;
    const list = group.querySelector('.card-list');
    items.forEach(t => {
      const card = document.createElement('div');
      card.className = `card ${t.domain} is-${t.status}`;
      card.innerHTML = `
        <span class="status-icon">${iconSvg(t.status)}</span>
        <div class="card-body">
          <p class="card-title">${t.title}</p>
          ${t.note ? `<p class="card-note">${t.note}</p>` : ''}
        </div>
      `;
      list.appendChild(card);
    });
    root.appendChild(group);
  });
}

document.getElementById('tab-upcoming').addEventListener('click', () => { currentView='upcoming'; render(); });
document.getElementById('tab-done').addEventListener('click', () => { currentView='done'; render(); });
document.getElementById('tab-insights').addEventListener('click', () => { currentView='insights'; render(); });
